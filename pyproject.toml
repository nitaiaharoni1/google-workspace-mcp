[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-suite-mcp"
version = "0.3.0"
description = "Aligned MCP servers for Gmail, Calendar, Sheets, Docs, and Drive with persistent, multi-account auth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nitai Aharoni" }]
keywords = ["mcp", "google", "gmail", "calendar", "sheets", "docs", "drive", "workspace", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.12",
    "google-auth-core>=0.1.0",
    "gmail-cli-oauth>=1.5.0",
    "google-calendar-cli>=1.6.0",
    "google-api-python-client>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/nitaiaharoni1/google-workspace-mcp"
Repository = "https://github.com/nitaiaharoni1/google-workspace-mcp"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-anyio>=0.0.0", "anyio>=4"]

[project.scripts]
gmail-mcp = "google_workspace_mcp.gmail.server:main"
gcal-mcp = "google_workspace_mcp.calendar.server:main"
gsheets-mcp = "google_workspace_mcp.sheets.server:main"
gdocs-mcp = "google_workspace_mcp.docs.server:main"
gdrive-mcp = "google_workspace_mcp.drive.server:main"

[tool.setuptools.packages.find]
include = ["google_workspace_mcp*"]

[tool.pytest.ini_options]
anyio_mode = "auto"
