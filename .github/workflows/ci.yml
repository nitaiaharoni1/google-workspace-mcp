name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # google-auth-core and the migrated CLIs must be resolvable. Once published
      # they install from PyPI; until then, check them out alongside this repo and
      # install from the local paths (uncomment the path installs below).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -e ../google-auth-core
          # pip install -e ../gmail-cli -e ../google-calendar-cli
          pip install google-auth-core gmail-cli google-calendar-cli
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q
        # Live tests are intentionally not run in CI (no credentials).
